name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - "phase-*"
      - "feature-*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: onprogram-plugin-bundle
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
