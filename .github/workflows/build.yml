name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - "phase-*"
      - "feature-*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit generated dev bundle
        if: github.event_name == 'push' && github.ref_name == 'dev'
        run: |
          if git diff --quiet -- main.js; then
            echo "main.js is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Build plugin bundle [skip ci]"
          git push

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: onprogram-plugin-bundle
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
